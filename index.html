<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Rock Paper Scissors adventure game !</h1>
    <p>
      Welcome to the Rock paper Scissors adventure game ! A strange universe
      where everything is done by playing rock paper scissors. Some political
      issues are solved by playing this game.
    </p>
    <p>For now, choose the creature you would like to fight against !</p>
    <button id="playBtn">Fight against the Scary Frog !</button>

    <script>
      const playBtn = document.querySelector("#playBtn");
      playBtn.addEventListener("click", () => {
        playBtn.textContent = "Loading...";
        setTimeout(() => {
          window.location.href = "frog-fight.html";
          playBtn.textContent = "Fight against the Scary Frog";
        }, 1000);
      });
    </script>
  </body>
</html>
